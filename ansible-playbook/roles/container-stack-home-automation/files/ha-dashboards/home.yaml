# Room-oriented Home Assistant dashboard. Managed by Ansible.
#
# This dashboard runs in YAML mode, so it CANNOT be edited in the Home Assistant
# UI - the Edit button is deliberately absent. To change it, edit this file and:
#
#   ansible-playbook site.yml -i inventories/default/hosts.ini --tags ha-dashboard
#
# then open the dashboard in HA and pick Refresh from the three-dot menu. No
# Home Assistant restart is needed for changes to this file.
#
# The existing Overview, Tablet view and Map dashboards are untouched by this
# and remain fully editable in the UI.
#
# Sections are ordered by how often a room is actually looked at, not
# alphabetically. Entity names are overridden wherever the entity_id is
# historical and no longer describes what is plugged in.

