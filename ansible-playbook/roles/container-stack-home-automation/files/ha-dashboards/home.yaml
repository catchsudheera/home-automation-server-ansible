# Room-oriented Home Assistant dashboard. Managed by Ansible.
#
# This dashboard runs in YAML mode, so it CANNOT be edited in the Home Assistant
# UI - the Edit button is deliberately absent. To change it, edit this file and:
#
#   ansible-playbook site.yml -i inventories/default/hosts.ini --tags ha-dashboard
#
# then open the dashboard in HA and pick Refresh from the three-dot menu. No
# Home Assistant restart is needed for changes to this file.
#
# The existing Overview, Tablet view and Map dashboards are untouched by this
# and remain fully editable in the UI.
#
# DEPENDENCIES - both are vendored in this repo under files/ha-www/custom-cards
# and must be registered once under Settings -> Dashboards -> Resources:
#   /local/custom-cards/bubble-card.js?v=3.2.5              (JavaScript module)
#   /local/custom-cards/mini-graph-card-bundle.js?v=0.13.0  (JavaScript module)
#
# Restart Home Assistant after adding or changing a resource, and after bumping a
# bundle's ?v= version. A browser refresh is not enough: cards can initialise
# before the module has finished loading and then render "Configuration error"
# on every custom card, which looks exactly like a broken dashboard but is not.
# Changing only this file needs no restart - Refresh from the three-dot menu.
#
# LAYOUT - one section per room, everything visible, no pop-ups. The separator
# carries the room name with live temperature and humidity beside it, then
# climate, then lights, then plugs with their live wattage as sub-buttons, then
# media, and finally the trend graphs. Rooms with several distinct groups use a
# second separator as an inline divider.
#
# THEME - set per view so it applies to this dashboard only. "Graphite" is always
# dark; swap to "Graphite Auto" to follow the viewer's light/dark preference.
#
# Entity names are overridden wherever the entity_id is historical and no longer
# describes what is plugged in.

