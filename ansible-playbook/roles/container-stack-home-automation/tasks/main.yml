---
- name: Create stack root directory
  file:
    path: "{{ ha_server_container_stack_location }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Create Home Assistant directories
  file:
    path: "{{ homeassistant_config_path }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Create ESP Home directories
  file:
    path: "{{ esphome_config_path }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Create Music Assistant directories
  file:
    path: "{{ musicassistant_data_path }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Create EVCC directories
  file:
    path: "{{ evcc_data_path }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Create ESP Home cache dir
  file:
    path: "{{ ha_server_container_stack_location }}/esphome/cache"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Create InfluxDB directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"
  loop:
    - "{{ influxdb_config_path }}"
    - "{{ influxdb_etc_path }}"
    - "{{ influxdb_password_path }}"

- name: Write InfluxDB admin password to a file
  copy:
    content: "{{ ui_login_admin_password }}"
    dest: "{{ influxdb_password_path }}/admin_password.txt"

- name: Check whether the influxdb API token file exist
  stat:
    path: "{{ influxdb_password_path }}/api_token.txt"
  register: influxdb_api_token_file

- name: Create the influxdb API token file - only on first time setup
  block:
    - name: Salvage token from an already deployed compose file
      shell: "grep -o 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=.*' {{ ha_server_container_stack_location }}/docker-compose.yml | cut -d= -f2"
      register: influxdb_api_token_salvaged
      failed_when: false
      changed_when: false

    - name: Write influxdb API token file
      copy:
        content: "{{ influxdb_api_token_salvaged.stdout | trim if (influxdb_api_token_salvaged.rc == 0 and influxdb_api_token_salvaged.stdout | trim | length > 0) else lookup('password', '/dev/null length=15 chars=ascii_letters') }}"
        dest: "{{ influxdb_password_path }}/api_token.txt"
        owner: "{{ server_data_dir_user }}"
        group: "{{ server_data_dir_group }}"
        mode: '0600'
  when: not influxdb_api_token_file.stat.exists

- name: Read the influxdb API token from the token file
  slurp:
    src: "{{ influxdb_password_path }}/api_token.txt"
  register: influxdb_api_token_file_content

- name: Set the influxdb API token fact
  set_fact:
    influxdb_api_token: "{{ influxdb_api_token_file_content.content | b64decode | trim }}"

- name: Create Grafana directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"
  loop:
    - "{{ grafana_config_path }}"
    - "{{ grafana_password_path }}"
    - "{{ grafana_provisioning_path }}"
    # The provisioning dir replaces the one shipped in the image, so every
    # subdirectory Grafana expects has to exist here, even when unused.
    - "{{ grafana_provisioning_path }}/datasources"
    - "{{ grafana_provisioning_path }}/dashboards"
    - "{{ grafana_provisioning_path }}/dashboards/definitions"
    - "{{ grafana_provisioning_path }}/plugins"
    - "{{ grafana_provisioning_path }}/alerting"
    - "{{ grafana_provisioning_path }}/access-control"

- name: Write Grafana admin password to a file
  copy:
    content: "{{ ui_login_admin_password }}"
    dest: "{{ grafana_password_path }}/admin_password.txt"

- name: Create Mosquitto directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"
  loop:
    - "{{ mosquitto_config_path }}/config"
    - "{{ mosquitto_config_path }}/data"
    - "{{ mosquitto_config_path }}/log"

- name: Copy Mosquitto config file
  copy:
    src: mosquitto.conf
    dest: "{{ mosquitto_config_path }}/config/mosquitto.conf"
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Check wether the mosquitto password file exist
  stat:
    path: "{{ mosquitto_config_path }}/config/password.txt"
  register: mosquitto_password_hash_file

- name: Mosquitto password generate and write hash file
  block:
    - name: Generate hass user password
      script:
        cmd: "mosquitto_password_generate.sh hass {{ mosquitto_hass_password }}"
      register: mosquitto_password_hash_file_content

    - name: Write mosquitto password file
      copy:
        content: "{{ mosquitto_password_hash_file_content.stdout_lines[0] }}\n"
        dest: "{{ mosquitto_config_path }}/config/password.txt"
        mode: '0700'
  when: not mosquitto_password_hash_file.stat.exists

- name: Copy Docker compose template
  template:
    src: docker-compose.yml.j2
    dest: "{{ ha_server_container_stack_location }}/docker-compose.yml"
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"

- name: Start Docker containers using docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ ha_server_container_stack_location }}"
  tags: start-stacks

- name: Wait for InfluxDB to be healthy - bucket and token provisioning needs the API up
  uri:
    url: http://localhost:8086/health
    status_code: 200
  register: influxdb_health
  until: influxdb_health.status == 200
  retries: 30
  delay: 10

- name: Check whether the EVCC InfluxDB bucket exists
  community.docker.docker_container_exec:
    container: influxdb
    command: "influx bucket list --org {{ influxdb_org_name }} --name {{ influxdb_evcc_bucket_name }} --token {{ influxdb_api_token }}"
  register: influxdb_evcc_bucket_list
  failed_when: false
  changed_when: false

- name: Create the EVCC InfluxDB bucket
  community.docker.docker_container_exec:
    container: influxdb
    command: "influx bucket create --org {{ influxdb_org_name }} --name {{ influxdb_evcc_bucket_name }} --retention {{ influxdb_evcc_bucket_retention }} --token {{ influxdb_api_token }}"
  register: influxdb_evcc_bucket_create
  failed_when: influxdb_evcc_bucket_create.rc != 0
  when: influxdb_evcc_bucket_list.rc != 0

- name: Check whether the EVCC influxdb token file exist
  stat:
    path: "{{ influxdb_evcc_token_path }}"
  register: influxdb_evcc_token_file

- name: Create a write-scoped influxdb token for EVCC - only on first time setup
  block:
    - name: Look up the EVCC bucket id
      community.docker.docker_container_exec:
        container: influxdb
        command: "influx bucket list --org {{ influxdb_org_name }} --name {{ influxdb_evcc_bucket_name }} --json --token {{ influxdb_api_token }}"
      register: influxdb_evcc_bucket_info
      failed_when: influxdb_evcc_bucket_info.rc != 0
      changed_when: false

    - name: Create the EVCC token - write access to the EVCC bucket only
      community.docker.docker_container_exec:
        container: influxdb
        command: "influx auth create --org {{ influxdb_org_name }} --write-bucket {{ (influxdb_evcc_bucket_info.stdout | from_json)[0].id }} --description evcc --json --token {{ influxdb_api_token }}"
      register: influxdb_evcc_token_create
      failed_when: influxdb_evcc_token_create.rc != 0

    # `auth create --json` prints a single object while `auth list --json` prints
    # a list - handle both so a CLI change does not silently write a broken file.
    - name: Write the EVCC influxdb token file
      copy:
        content: "{{ token_json[0].token if token_json is not mapping else token_json.token }}"
        dest: "{{ influxdb_evcc_token_path }}"
        owner: "{{ server_data_dir_user }}"
        group: "{{ server_data_dir_group }}"
        mode: '0600'
      vars:
        token_json: "{{ influxdb_evcc_token_create.stdout | from_json }}"
  when: not influxdb_evcc_token_file.stat.exists

- name: Read the EVCC influxdb token from the token file
  slurp:
    src: "{{ influxdb_evcc_token_path }}"
  register: influxdb_evcc_token_file_content

- name: Set the EVCC influxdb token fact
  set_fact:
    influxdb_evcc_token: "{{ influxdb_evcc_token_file_content.content | b64decode | trim }}"

- name: Check whether the Grafana influxdb token file exist
  stat:
    path: "{{ influxdb_grafana_token_path }}"
  register: influxdb_grafana_token_file

- name: Create a read-only influxdb token for Grafana - only on first time setup
  block:
    # Read access to every bucket in the org, so buckets added later work without
    # having to re-issue this token.
    - name: Create the Grafana token - read access only
      community.docker.docker_container_exec:
        container: influxdb
        command: "influx auth create --org {{ influxdb_org_name }} --read-buckets --description grafana --json --token {{ influxdb_api_token }}"
      register: influxdb_grafana_token_create
      failed_when: influxdb_grafana_token_create.rc != 0

    - name: Write the Grafana influxdb token file
      copy:
        content: "{{ token_json[0].token if token_json is not mapping else token_json.token }}"
        dest: "{{ influxdb_grafana_token_path }}"
        owner: "{{ server_data_dir_user }}"
        group: "{{ server_data_dir_group }}"
        mode: '0600'
      vars:
        token_json: "{{ influxdb_grafana_token_create.stdout | from_json }}"
  when: not influxdb_grafana_token_file.stat.exists

- name: Read the Grafana influxdb token from the token file
  slurp:
    src: "{{ influxdb_grafana_token_path }}"
  register: influxdb_grafana_token_file_content
  tags: grafana

- name: Set the Grafana influxdb token fact
  set_fact:
    influxdb_grafana_token: "{{ influxdb_grafana_token_file_content.content | b64decode | trim }}"
  tags: grafana

- name: Copy the Grafana datasource provisioning file
  template:
    src: grafana-datasources.yml.j2
    dest: "{{ grafana_provisioning_path }}/datasources/datasources.yml"
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"
    mode: '0600'
  register: grafana_datasources_provisioning
  tags: grafana

- name: Copy the Grafana dashboard provider file
  template:
    src: grafana-dashboards.yml.j2
    dest: "{{ grafana_provisioning_path }}/dashboards/dashboards.yml"
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"
  register: grafana_dashboard_provider
  tags: grafana

- name: Copy the Grafana dashboards
  template:
    src: "{{ item }}"
    dest: "{{ grafana_provisioning_path }}/dashboards/definitions/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: "{{ server_data_dir_user }}"
    group: "{{ server_data_dir_group }}"
  loop:
    - grafana-dashboard-evcc.json.j2
    - grafana-dashboard-climate.json.j2
    - grafana-dashboard-appliances.json.j2
    - grafana-dashboard-solar.json.j2
    - grafana-dashboard-maintenance.json.j2
  tags: grafana

# Dashboards are re-read by the file provider every 30s, but datasources and the
# provider config itself are only read at startup.
- name: Restart Grafana when its provisioning config changed
  command: docker restart grafana
  when: grafana_datasources_provisioning.changed or grafana_dashboard_provider.changed
  tags: grafana

- name: Adding additional configs - should be done after the initial start of the containers
  block:
    - name: Wait for Home Assistant to create its main config file - takes a while on first boot
      wait_for:
        path: "{{ homeassistant_config_path }}/configuration.yaml"
        timeout: 300

    - name: Stopping using docker compose for config update
      community.docker.docker_compose_v2:
        project_src: "{{ ha_server_container_stack_location }}"
        state: absent

    - name: Add Homeassistant config file for influxdb
      template:
        src: influxdb.yml.j2
        dest: "{{ homeassistant_config_path }}/influxdb.yml"
        owner: "{{ server_data_dir_user }}"
        group: "{{ server_data_dir_group }}"

    - name: Check home assistant main config file for influxdb import
      lineinfile:
        state: absent
        path: "{{ homeassistant_config_path }}/configuration.yaml"
        regexp: "^influxdb: !include influxdb.yml$"
      check_mode: true
      changed_when: false
      register: influxdb_imported_in_ha_config

    - name: Add influxdb import line to home assistant main confile file
      lineinfile:
        path: "{{ homeassistant_config_path }}/configuration.yaml"
        line: "influxdb: !include influxdb.yml"
      when: influxdb_imported_in_ha_config.found == 0

    - name: Start Docker containers using docker-compose after the config update
      community.docker.docker_compose_v2:
        project_src: "{{ ha_server_container_stack_location }}"

- name: Wait for Grafana to be healthy - migrations on a fresh database take a while
  uri:
    url: http://localhost:3000/api/health
    status_code: 200
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 10

- name: Ensure grafana password is set correctly by resetting
  community.docker.docker_container_exec:
    container: grafana
    command: "grafana cli admin reset-admin-password '{{ ui_login_admin_password }}'"

- name: Adding the Systemd units for docker-compose management
  import_role:
    name: docker-compose-systemd
  vars:
    docker_compose_dir_path: "{{ ha_server_container_stack_location }}"
    stack_name: container-stack-home-automation

- name: Stop Docker containers if running
  block:
    - name: Check wether the docker file exist
      stat:
        path: "{{ ha_server_container_stack_location }}/docker-compose.yml"
      register: ha_server_container_stack_location_docker_compose_file

    - name: Check validity of compose file
      shell: "docker compose -f {{ ha_server_container_stack_location }}/docker-compose.yml config"
      register: ha_server_container_stack_docker_compose_file_validate
      ignore_errors: yes

    - name: Stopping using docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ ha_server_container_stack_location }}"
        state: absent
      when: ha_server_container_stack_location_docker_compose_file.stat.exists and ha_server_container_stack_docker_compose_file_validate.failed|bool != true
  tags: [ 'never', 'stop-stacks' ]